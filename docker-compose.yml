version: "3.8"

services:
  # ===================
  # Temporal Infrastructure
  # ===================

  postgresql:
    image: postgres:15-alpine
    container_name: food_delivery_postgres
    environment:
      POSTGRES_USER: temporal
      POSTGRES_PASSWORD: temporal
      POSTGRES_DB: temporal
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U temporal"]
      interval: 5s
      timeout: 5s
      retries: 5

  temporal:
    image: temporalio/auto-setup:1.29.3
    container_name: food_delivery_temporal
    depends_on:
      postgresql:
        condition: service_healthy
    environment:
      - DB=postgres12
      - DB_PORT=5432
      - POSTGRES_USER=temporal
      - POSTGRES_PWD=temporal
      - POSTGRES_SEEDS=postgresql
      # Expose Prometheus metrics for all server roles (frontend/history/matching/worker).
      # The auto-setup config template wires this into global.metrics.prometheus.listenAddress.
      - PROMETHEUS_ENDPOINT=0.0.0.0:8000
    ports:
      - "7233:7233"   # gRPC frontend
      - "9091:8000"   # Prometheus metrics (host 9091 -> container 8000)
    healthcheck:
      test: ["CMD", "tctl", "--address", "temporal:7233", "cluster", "health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  temporal-ui:
    image: temporalio/ui:2.51.0
    container_name: food_delivery_temporal_ui
    depends_on:
      temporal:
        condition: service_healthy
    environment:
      - TEMPORAL_ADDRESS=temporal:7233
      - TEMPORAL_CORS_ORIGINS=http://localhost:3000
    ports:
      - "8080:8080"

  # ===================
  # Observability (Prometheus + Grafana)
  # Docs: https://docs.temporal.io/self-hosted-guide/monitoring
  # ===================

  prometheus:
    image: prom/prometheus:v2.54.1
    container_name: food_delivery_prometheus
    depends_on:
      temporal:
        condition: service_healthy
    volumes:
      - ./docker/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
    ports:
      - "9090:9090"

  grafana:
    image: grafana/grafana:11.2.0
    container_name: food_delivery_grafana
    depends_on:
      - prometheus
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_INSTALL_PLUGINS=victoriametrics-logs-datasource
    volumes:
      - ./docker/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./docker/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    ports:
      - "3030:3000"

  # ===================
  # Distributed tracing (OpenTelemetry -> Zipkin)
  # Temporal SDK interceptors emit spans via OTLP/HTTP to the collector,
  # which forwards them to Zipkin.
  # ===================

  zipkin:
    image: openzipkin/zipkin:3
    container_name: food_delivery_zipkin
    ports:
      - "9411:9411"

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.110.0
    container_name: food_delivery_otel_collector
    depends_on:
      - zipkin
    command: ["--config=/etc/otel/config.yaml"]
    volumes:
      - ./docker/otel/config.yaml:/etc/otel/config.yaml:ro
    ports:
      - "4318:4318"   # OTLP/HTTP
      - "4317:4317"   # OTLP/gRPC

  # ===================
  # Logs (Vector -> VictoriaLogs)
  # Vector tails the app container's stdout via the Docker socket and ships it
  # to VictoriaLogs; query it in Grafana via the VictoriaLogs datasource.
  # ===================

  victorialogs:
    image: victoriametrics/victoria-logs:v1.40.0
    container_name: food_delivery_victorialogs
    command:
      - "--storageDataPath=/vlogs"
      - "--httpListenAddr=:9428"
    volumes:
      - victorialogs_data:/vlogs
    ports:
      - "9428:9428"

  vector:
    image: timberio/vector:0.50.0-debian
    container_name: food_delivery_vector
    depends_on:
      - victorialogs
    command: ["--config", "/etc/vector/vector.yaml"]
    volumes:
      - ./docker/vector/vector.yaml:/etc/vector/vector.yaml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro

  # ===================
  # Testing infrastructure
  # Dedicated Temporal server for tests so the main app's RoadRunner worker
  # (connected to `temporal:7233`) can never intercept the test worker's
  # workflows/activities. Only the test worker connects here.
  # ===================

  app-postgresql-testing:
    image: postgres:15-alpine
    container_name: food_delivery_app_postgresql_testing
    environment:
      POSTGRES_USER: temporal
      POSTGRES_PASSWORD: temporal
      POSTGRES_DB: temporal
    ports:
      - "5434:5432"
    volumes:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U temporal"]
      interval: 5s
      timeout: 5s
      retries: 10

  temporal-testing:
    image: temporalio/auto-setup:1.29.3
    container_name: food_delivery_temporal_testing
    depends_on:
      app-postgresql-testing:
        condition: service_healthy
    environment:
      - DB=postgres12
      - DB_PORT=5432
      - POSTGRES_USER=temporal
      - POSTGRES_PWD=temporal
      - POSTGRES_SEEDS=app-postgresql-testing
    ports:
      - "7234:7233"   # gRPC frontend (host 7234 -> container 7233)
    healthcheck:
      test: ["CMD", "tctl", "--address", "temporal-testing:7233", "cluster", "health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  temporal-ui-testing:
    image: temporalio/ui:2.51.0
    container_name: food_delivery_temporal_ui_testing
    depends_on:
      temporal-testing:
        condition: service_healthy
    environment:
      - TEMPORAL_ADDRESS=temporal-testing:7233
      - TEMPORAL_CORS_ORIGINS=http://localhost:3001
    ports:
      - "8081:8080"

  # ===================
  # Application
  # ===================

  app-postgresql:
    image: postgres:15-alpine
    container_name: food_delivery_app_postgresql
    environment:
      POSTGRES_DB: laravel
      POSTGRES_PASSWORD: test
      POSTGRES_USER: test
    ports:
      - "5433:5432"
    volumes:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U test"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: food_delivery_app
    depends_on:
      temporal:
        condition: service_healthy
      temporal-testing:
        condition: service_healthy
      app-postgresql:
        condition: service_healthy
      otel-collector:
        condition: service_started
    volumes:
      - ./:/app
    ports:
      - "8000:8000"   # HTTP
      - "6001:6001"   # RoadRunner RPC
      - "9095:9095"   # Temporal SDK metrics (Prometheus)
      - "2112:2112"   # Application metrics (Prometheus)
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - TEMPORAL_ADDRESS=temporal:7233
      - APP_ENV=local
      - APP_DEBUG=true
      - PHP_IDE_CONFIG=serverName=food-delivery
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector:4318
      - OTEL_SERVICE_NAME=food-delivery
    command: ["/usr/local/bin/rr", "serve", "-c", ".rr.yaml"]

volumes:
  postgres_data:
  prometheus_data:
  grafana_data:
  victorialogs_data:
