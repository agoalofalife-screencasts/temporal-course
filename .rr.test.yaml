version: "3"

# Isolated RPC port for the test stack so it never collides with the running
# app RoadRunner (which holds 6001 via .rr.yaml and has no kv plugin).
rpc:
  listen: "tcp://127.0.0.1:6002"

server:
  command: "php ./vendor/bin/roadrunner-worker"
  relay: pipes
  env:
    - APP_ENV: testing
    - APP_BASE_PATH: "/app"
    - LARAVEL_OCTANE: 1
    - LOG_CHANNEL: single

http:
  # 8001, not 8000 — the app RoadRunner already holds 8000 in the container.
  # (The temporal worker doesn't need http, but keeping the plugin on a free port.)
  address: "0.0.0.0:8001"
  middleware:
    - gzip
    - static
  static:
    dir: public
    forbid:
      - .php
      - .htaccess
  pool:
    num_workers: 1
    max_jobs: 64
    supervisor:
      max_worker_memory: 128

kv:
  test:
    driver: memory
    config:
      interval: 10

# Temporal plugin конфигурация
# Dedicated test Temporal server (docker service `temporal-testing`), isolated
# from the app's `temporal:7233` so the app worker can't steal test activities.
temporal:
  address: "${TEMPORAL_ADDRESS:-temporal-testing:7233}"

  activities:
    # Pool для Activities
    num_workers: 2
    command: "php ./vendor/bin/roadrunner-temporal-worker"

logs:
  # RoadRunner перенаправляет stderr PHP-воркеров в свой лог-пайплайн.
  # Laravel пишет в php://stderr (LOG_CHANNEL=stderr), RR подхватывает.
  level: debug
  encoding: json
  mode: production
  output: ["stdout"]
  channels:
    server:
      mode: raw
      level: debug
      encoding: console
      output: ["stdout"]
      err_output: ["stdout"]
