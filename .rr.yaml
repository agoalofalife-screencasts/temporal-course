version: "3"

rpc:
  listen: "tcp://127.0.0.1:6001"

server:
  command: "php ./vendor/bin/roadrunner-worker"
  relay: pipes
  env:
    - APP_BASE_PATH: "/app"
    - LARAVEL_OCTANE: 1

http:
  address: "0.0.0.0:8000"
  middleware:
    - gzip
    - static
  static:
    dir: public
    forbid:
      - .php
      - .htaccess
  pool:
    num_workers: 1
    max_jobs: 64
    supervisor:
      max_worker_memory: 128

# Temporal plugin конфигурация
temporal:
  address: "${TEMPORAL_ADDRESS:-localhost:7233}"

  # Go SDK metrics, retransmitted by RoadRunner to a Prometheus endpoint.
  # Docs: https://docs.roadrunner.dev/docs/logging-and-observability/metrics#temporal-metrics
  # Bind to 0.0.0.0 so the Prometheus container can scrape app:9095/metrics.
  metrics:
    driver: prometheus
    prometheus:
      address: "0.0.0.0:9095"
      type: "summary"
      prefix: "temporal_sdk"

  activities:
    # Pool для Activities
    num_workers: 2
    # Xdebug enabled only for activity workers (RR has no per-pool env config,
    # so we use /usr/bin/env to inject XDEBUG_TRIGGER inline)
    command: "/usr/bin/env XDEBUG_TRIGGER=PHPSTORM php ./vendor/bin/roadrunner-temporal-worker"

# Application metrics plugin — exposes custom metrics pushed from PHP via the
# roadrunner-metrics RPC client.
# Docs: https://docs.roadrunner.dev/docs/logging-and-observability/metrics#application-metrics
# Bind to 0.0.0.0 so the Prometheus container can scrape app:2112/metrics.
metrics:
  address: "0.0.0.0:2112"
  collect:
    created_orders:
      type: counter
      help: "Total number of created orders."
    restaurant_order_rejects:
      type: counter
      help: "Total number of orders rejected by the restaurant."

logs:
  # RoadRunner redirect stderr PHP-workers to own log pipeline
  # Laravel write php://stderr (LOG_CHANNEL=stderr), RR catch it.
  level: debug
  encoding: json
  mode: production
  output: ["stdout"]
  channels:
    server:
      mode: raw
      level: debug
      encoding: console
      output: ["stdout"]
      err_output: ["stdout"]
